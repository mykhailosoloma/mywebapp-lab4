---
- name: Install Java
  apt:
    name: openjdk-21-jre-headless
    state: present
    update_cache: true

- name: Create app directory
  file:
    path: /opt/mywebapp
    state: directory
    owner: app
    group: app
    mode: '0755'

- name: Copy application jar
  copy:
    src: "{{ playbook_dir }}/../mywebapp.jar"
    dest: /opt/mywebapp/mywebapp.jar
    owner: app
    group: app
    mode: '0644'
  notify: restart mywebapp

- name: Create app config
  template:
    src: application.yml.j2
    dest: /opt/mywebapp/application.yml
    owner: app
    group: app
    mode: '0640'
  notify: restart mywebapp

- name: Create systemd unit
  template:
    src: mywebapp.service.j2
    dest: /etc/systemd/system/mywebapp.service
    mode: '0644'
  notify:
    - daemon reload
    - restart mywebapp

- name: Configure operator sudo rights
  copy:
    dest: /etc/sudoers.d/operator-mywebapp
    content: |
      operator ALL=(root) NOPASSWD: /usr/bin/systemctl start mywebapp
      operator ALL=(root) NOPASSWD: /usr/bin/systemctl stop mywebapp
      operator ALL=(root) NOPASSWD: /usr/bin/systemctl restart mywebapp
      operator ALL=(root) NOPASSWD: /usr/bin/systemctl status mywebapp
    mode: '0440'

- name: Enable and start mywebapp
  systemd:
    name: mywebapp
    state: started
    enabled: true
    daemon_reload: true
