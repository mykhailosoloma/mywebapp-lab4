---
- name: Install PostgreSQL
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present
    update_cache: true

- name: Start and enable PostgreSQL
  systemd:
    name: postgresql
    state: started
    enabled: true

- name: Create database user
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    state: present
  become: true
  become_user: postgres

- name: Create database
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
    state: present
  become: true
  become_user: postgres

- name: Grant database privileges
  community.postgresql.postgresql_privs:
    db: "{{ db_name }}"
    role: "{{ db_user }}"
    type: database
    privs: ALL
    state: present
  become: true
  become_user: postgres

- name: Get PostgreSQL version
  command: ls /etc/postgresql/
  register: pg_version
  changed_when: false

- name: Configure PostgreSQL listen address
  lineinfile:
    path: "/etc/postgresql/{{ pg_version.stdout_lines[0] }}/main/postgresql.conf"
    regexp: "^#?listen_addresses"
    line: "listen_addresses = '{{ db_listen_ip }},127.0.0.1'"
  notify: restart postgresql

- name: Allow worker to connect
  lineinfile:
    path: "/etc/postgresql/{{ pg_version.stdout_lines[0] }}/main/pg_hba.conf"
    line: "host {{ db_name }} {{ db_user }} {{ worker_ip }}/32 md5"
    state: present
  notify: restart postgresql

- name: Install ufw
  apt:
    name: ufw
    state: present

- name: Allow PostgreSQL from worker only
  ufw:
    rule: allow
    port: "5432"
    src: "{{ worker_ip }}"

- name: Enable UFW
  ufw:
    state: enabled
    policy: allow

- name: Create tasks table
  community.postgresql.postgresql_table:
    db: "{{ db_name }}"
    name: tasks
    state: present
    columns:
      - name: id
        type: bigserial
        primary_key: true
      - name: title
        type: varchar(255)
        not_null: true
      - name: status
        type: varchar(50)
        not_null: true
        default: "'pending'"
      - name: created_at
        type: timestamp
        not_null: true
        default: now()
  become: true
  become_user: postgres

- name: Grant table permissions
  community.postgresql.postgresql_privs:
    db: "{{ db_name }}"
    role: "{{ db_user }}"
    type: table
    objs: tasks
    privs: ALL
    state: present
  become: true
  become_user: postgres
