---
- name: Create teacher user
  user:
    name: teacher
    shell: /bin/bash
    create_home: true
    groups: sudo
    append: true

- name: Set teacher password
  user:
    name: teacher
    password: "{{ teacher_password_hash }}"

- name: Create operator user
  user:
    name: operator
    shell: /bin/bash
    create_home: true

- name: Set operator password
  user:
    name: operator
    password: "{{ operator_password_hash }}"

- name: Create app user
  user:
    name: app
    shell: /bin/false
    create_home: false
    system: true

- name: Install common packages
  apt:
    name:
      - curl
      - ca-certificates
      - python3
      - acl
    state: present
    update_cache: true

- name: Create student home directory
  file:
    path: /home/student
    state: directory
    mode: '0755'

- name: Create gradebook file
  copy:
    dest: /home/student/gradebook
    content: "{{ gradebook_number }}"
    mode: '0644'
