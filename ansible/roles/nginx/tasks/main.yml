---
- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Configure nginx
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/mywebapp
    mode: '0644'
  notify: reload nginx

- name: Enable site
  file:
    src: /etc/nginx/sites-available/mywebapp
    dest: /etc/nginx/sites-enabled/mywebapp
    state: link
  notify: reload nginx

- name: Remove default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Configure operator sudo for nginx
  copy:
    dest: /etc/sudoers.d/operator-nginx
    content: |
      operator ALL=(root) NOPASSWD: /usr/bin/systemctl reload nginx
    mode: '0440'

- name: Start and enable nginx
  systemd:
    name: nginx
    state: started
    enabled: true
